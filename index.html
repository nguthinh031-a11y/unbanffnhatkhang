<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINH THỊNH CHỌC CHÓ</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #334155;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Dog Icon Banner Container */
        .dog-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            background: #fff7ed;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            border: 4px solid #ffedd5;
        }

        .dog-icon {
            font-size: 70px;
            color: #f97316;
            animation: bounce 2s infinite ease-in-out;
        }

        /* Wrench icon badge */
        .tool-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #0ea5e9;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            border: 3px solid #fff;
            animation: rotate 4s infinite linear;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        p.description {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Progress Bar */
        .progress-box {
            margin-bottom: 30px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background-color: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #f97316, #fb923c);
            border-radius: 10px;
            position: relative;
            animation: progress-stripe 1.5s linear infinite;
        }

        /* Contact / Social Links */
        .contact-info {
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            margin-top: 10px;
        }

        .contact-info p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f8fafc;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 16px;
            border: 1px solid #e2e8f0;
        }

        .social-links a:hover {
            background: #f97316;
            color: #ffffff;
            transform: translateY(-3px);
            border-color: #f97316;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Dog Icon Container -->
        <div class="dog-wrapper">
            <i class="fa-solid fa-dog dog-icon"></i>
            <div class="tool-badge">
                <i class="fa-solid fa-wrench"></i>
            </div>
        </div>

        <!-- Heading & Subtext -->
        <h1>CHỌC CHÓ NÓ CAY LIU LIU </h1>
        <p class="description">
            Chú cún thông minh của chúng tôi đang tích cực nâng cấp trang web để đem lại trải nghiệm tốt nhất cho bạn. Rất mong bạn thông cảm và quay lại sau nhé! Woof! 🐾
        </p>

        <!-- Progress Bar -->
        <div class="progress-box">
            <div class="progress-label">
                <span>Tiến độ cập nhật</span>
                <span>75%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Footer / Contact Info -->
        <div class="contact-info">
            <p>Nếu bạn cần hỗ trợ gấp, vui lòng liên hệ với chúng tôi qua:</p>
            <div class="social-links">
                <a href="#" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="mailto:support@example.com" title="Email"><i class="fa-solid fa-envelope"></i></a>
                <a href="tel:0123456789" title="Hotline"><i class="fa-solid fa-phone"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
